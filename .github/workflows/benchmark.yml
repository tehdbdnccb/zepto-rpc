name: Performance & Latency Regression

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  criterion-bench:
    name: Nanosecond Latency Profile & Throughput Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Criterion Microbenchmarks
        run: |
          RUSTFLAGS="-C target-cpu=native" cargo bench --workspace -- --output-format bencher | tee bench_result.txt

      - name: Store Benchmark Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: criterion-reports
          path: target/criterion/